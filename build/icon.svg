  <rect x="96" y="198" width="64" height="32" rx="6" fill="#1e293b"/>
  <circle cx="112" cy="210" r="3" fill="#22c55e"/>
  <circle cx="128" cy="210" r="3" fill="#22c55e"/>
  <circle cx="144" cy="210" r="3" fill="#22c55e"/>
  <circle cx="112" cy="222" r="3" fill="#22c55e"/>
  <circle cx="128" cy="222" r="3" fill="#22c55e"/>
  <circle cx="144" cy="222" r="3" fill="#22c55e"/>

  <!-- Text -->
